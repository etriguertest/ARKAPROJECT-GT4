spring:
  application:
    name: inventory
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    #url: r2dbc:postgresql://localhost:5432/postgres
    #url: r2dbc:postgresql://host.docker.internal:5432/postgres
    #username: postgres
    #password:
server:
  port: 8080


# ===============================================~
# ADD YOUR EXTERNAL RESOURCE CONFIGURATION HERE
# ===============================================~
external:
  api:
    product-url: "http://ec2-3-144-44-244.us-east-2.compute.amazonaws.com/v1/api/product" # The base URL for the Product API
    timeout-ms: 3000


