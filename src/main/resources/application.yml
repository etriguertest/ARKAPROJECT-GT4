spring:
  application:
    name: product
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  sql:   # Opcional, si quieres habilitar logs de SQL
    init:
      mode: always
  logging:
    level:
      com.amazonaws: DEBUG
      org.springframework.cloud.aws.messaging: DEBUG