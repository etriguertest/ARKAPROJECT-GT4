<p-toast></p-toast>
<p-toolbar styleClass="mb-6">
            <ng-template #start>
                <p-button label="Nuevo" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
                <!-- <p-button severity="secondary" label="Eliminar" icon="pi pi-trash" outlined (onClick)="deleteSelectedProducts()" [disabled]="!selectedProducts || !selectedProducts.length" /> -->
            </ng-template>

            <ng-template #end>
                <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
            </ng-template>
        </p-toolbar>

        <p-table
            #dt
            [value]="products()"
            [rows]="10"
            [columns]="cols"
            [paginator]="true"
            [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']"
            [tableStyle]="{ 'min-width': '75rem' }"
            [(selection)]="selectedProducts"
            [rowHover]="true"
            dataKey="id"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products"
            [showCurrentPageReport]="true"
            [rowsPerPageOptions]="[10, 20, 30]">

            <ng-template #caption>
                <div class="flex items-center justify-between">
                    <h5 class="m-0">Productos</h5>
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
                    </p-iconfield>
                </div>  
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="min-width: 16rem">Codigo</th>
                    <th pSortableColumn="name" style="min-width:16rem">
                        Nombre
                        <p-sortIcon field="name" />
                    </th>
                    <th pSortableColumn="price" style="min-width: 8rem">
                        Descripcion
                        <p-sortIcon field="price" />
                    </th>
                    <th pSortableColumn="price" style="min-width: 8rem">
                        Precio
                        <p-sortIcon field="price" />
                    </th>
                    <th pSortableColumn="category" style="min-width:10rem">
                        Categoria
                        <p-sortIcon field="category" />
                    </th>
                    <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                        Estatus
                        <p-sortIcon field="inventoryStatus" />
                    </th>
                    <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                        Stock Venta
                        <p-sortIcon field="inventoryStatus" />
                    </th>
                    <!-- <th style="min-width: 12rem"></th> -->
                </tr>
            </ng-template>
            <ng-template #body let-product>
                <tr>
                    <td style="min-width: 12rem">{{ product.id }}</td>
                    <td style="min-width: 16rem">{{ product.name }}</td>
                    <td style="min-width: 16rem">{{ product.description }}</td>
                    <td>{{ product.price | currency: 'USD' }}</td>
                    <td>{{ product.categoryName }}</td>
                    <td>
                        <p-tag [value]="getLabelSeverity(product.stock)" [severity]="getStockSeverity(product.stock)" />
                    </td>
                    <td>{{ product.stock }}</td>
                    <!-- <td> -->
                        <!-- <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editProduct(product)" /> -->
                        <!-- <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteProduct(product)" /> -->
                    <!-- </td> -->
                </tr>
            </ng-template>
        </p-table>

        <p-dialog [(visible)]="productDialog" [style]="{ width: '450px' }" header="Detalle Producto" [modal]="true">
            <ng-template #content>
                <div class="flex flex-col gap-6">
                    <!-- <img [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image" [alt]="product.image" class="block m-auto pb-4" *ngIf="product.image" /> -->
                    <div>
                        <label for="name" class="block font-bold mb-3">Nombre</label>
                        <input type="text" pInputText id="name" [(ngModel)]="product!.name" required autofocus fluid />
                        <small class="text-red-500" *ngIf="submitted && !product!.name">Nombre es requerido.</small>
                    </div>
                    <div>
                        <label for="description" class="block font-bold mb-3">Descripcion</label>
                        <textarea id="description" pTextarea [(ngModel)]="product!.description" required rows="3" cols="20" fluid></textarea>
                    </div>
                    <div>
                        <label for="description" class="block font-bold mb-3">Sucursal</label>
                        <p-select [(ngModel)]="monitorDropdownEstadoModel" [options]="monitorDropdownEstadoValues" optionLabel="name" placeholder="Seleccionar Sucursal" style="font-size: 12px;"  fluid/>
                    </div>

                    <div>
                        <label for="inventoryStatus" class="block font-bold mb-3">Inventory Status</label>
                        <!-- <p-select [(ngModel)]="product.inventoryStatus" inputId="inventoryStatus" [options]="statuses" optionLabel="label" optionValue="label" placeholder="Select a Status" fluid /> -->
                         <p-tag [value]="getLabelSeverity(product!.stock)" [severity]="getStockSeverity(product!.stock)" />
                        <!-- <p-select [(ngModel)]="product.inventoryStatus" inputId="inventoryStatus" [options]="statuses" optionLabel="label" optionValue="label" placeholder="Select a Status" fluid /> -->
                    </div>

                    <div>
                        <span class="block font-bold mb-4">Categoria</span>
                        <div class="grid grid-cols-12 gap-4">
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category1" name="category" [value]="1" [(ngModel)]="product!.categoryId" />
                                <label for="category1">Componentes</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category2" name="category" [value]="2" [(ngModel)]="product!.categoryId" />
                                <label for="category2">Periféricos</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category3" name="category" [value]="3" [(ngModel)]="product!.categoryId" />
                                <label for="category3">Computadoras y Laptops</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category4" name="category" [value]="4" [(ngModel)]="product!.categoryId" />
                                <label for="category4">Almacenamiento</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category4" name="category" [value]="5" [(ngModel)]="product!.categoryId" />
                                <label for="category4">Redes y Conectividad</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category4" name="category" [value]="6" [(ngModel)]="product!.categoryId" />
                                <label for="category4">Accesorios y Cables</label>
                            </div>
                            <div class="flex items-center gap-2 col-span-6">
                                <p-radiobutton id="category4" name="category" [value]="7" [(ngModel)]="product!.categoryId" />
                                <label for="category4">Software</label>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-4">
                            <label for="price" class="block font-bold mb-3">Precio</label>
                            <p-inputnumber id="price" [(ngModel)]="product!.price" mode="currency" currency="USD" locale="en-US"  fluid />
                        </div>
                        <div class="col-span-4">
                            <label for="costFormModel" class="block font-bold mb-3">Costo de Venta</label>
                            <p-inputnumber id="costFormModel" [(ngModel)]="costFormModel" mode="currency" currency="USD" locale="en-US" fluid />
                        </div>
                        <div class="col-span-4">
                            <label for="stock" class="block font-bold mb-3">Cantidad</label>
                            <p-inputnumber id="stock" [(ngModel)]="product!.stock" fluid />
                        </div>
                        <!-- <div class="col-span-6">
                            <label for="branchFormModel" class="block font-bold mb-3">Sucursal</label>
                            <p-inputnumber id="branchFormModel" [(ngModel)]="branchFormModel" fluid />
                        </div> -->
                    </div>
                </div>
            </ng-template>

            <ng-template #footer>
                <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
                <p-button label="Save" icon="pi pi-check" (click)="saveProduct()" />
            </ng-template>
        </p-dialog>

        <p-confirmdialog [style]="{ width: '450px' }" />
